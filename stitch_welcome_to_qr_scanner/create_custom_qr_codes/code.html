<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Custom QR Codes - Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec49",
              "background-light": "#f6f8f6",
              "background-dark": "#102215",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      /* Custom utility for the glowing effect mentioned in the plan */
      .glow-effect {
        box-shadow: 0 0 50px -10px rgba(19, 236, 73, 0.3);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display h-screen flex flex-col overflow-hidden">
<!-- Top Navigation Area -->
<div class="flex items-center w-full p-4 pt-12 pb-2 justify-end z-10">
<button class="flex items-center justify-end group transition-opacity opacity-70 hover:opacity-100">
<span class="text-white text-sm font-semibold leading-normal tracking-wide">Skip</span>
</button>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center relative w-full max-w-md mx-auto px-6">
<!-- Hero Illustration -->
<!-- Using a combination of divs to simulate the 'stack' and 'glowing' effect described -->
<div class="relative w-full aspect-square max-w-[320px] flex items-center justify-center mb-8">
<!-- Background Glow -->
<div class="absolute inset-0 bg-primary/20 rounded-full blur-3xl scale-75 animate-pulse"></div>
<!-- Background Card (Stacked effect) -->
<div class="absolute w-[85%] h-[85%] bg-[#1E2E23] rounded-2xl rotate-[-6deg] translate-y-2 opacity-60 border border-white/5"></div>
<div class="absolute w-[90%] h-[90%] bg-[#18281D] rounded-2xl rotate-[-3deg] translate-y-1 opacity-80 border border-white/5"></div>
<!-- Main Card -->
<div class="relative w-full h-full bg-[#112215] border border-primary/30 rounded-2xl flex flex-col items-center justify-center shadow-2xl glow-effect overflow-hidden">
<!-- Abstract header inside card -->
<div class="absolute top-0 w-full h-1/3 bg-gradient-to-b from-primary/10 to-transparent"></div>
<!-- QR Code Representation -->
<div class="relative bg-white p-4 rounded-xl shadow-lg">
<img alt="Stylized QR code graphic showing a wifi pattern" class="w-32 h-32 opacity-90 mix-blend-multiply block dark:hidden" data-alt="Stylized QR code graphic showing a wifi pattern" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCx23PJiqSSPXvmvG1sTbjXeN5yrPifT0Fd33lBIgYntgzYZp02xddgtUg-qSUTNFmnSClUtPUYD4KACyV74zE4fhAL29D7i1e9J5bVbMdg-WsWhP7VaZOAwnYYRdpI2Iz5SdbLPgvWhjIhmFbv8DA5-V5MVQoxPZxLYCfIHH48BKq1rMikRtzOlfNwshBWw0lwkELdYu0S_WFn16jS8Tu7w5HzPMFmu4WH-E2R6O5i14jIOGgi1C_N0CvzDs93XCDJTWPy_uqJRX5"/>
<!-- Dark mode inverted QR for better visual if needed, but QR usually works best dark on light. Keeping white bg for QR container. -->
<div class="w-32 h-32 bg-[url('https://api.qrserver.com/v1/create-qr-code/?size=150x150&amp;data=Example')] bg-cover opacity-90"></div>
<!-- Center Icon Overlay -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-primary text-[#102215] p-2 rounded-full shadow-md">
<span class="material-symbols-outlined text-2xl">wifi</span>
</div>
</div>
</div>
<!-- Floating Input Source Icons -->
<div class="absolute -right-4 top-1/4 bg-[#1E2E23] p-2 rounded-lg border border-primary/20 shadow-lg flex items-center gap-2 animate-bounce" style="animation-duration: 3s;">
<span class="material-symbols-outlined text-primary text-sm">link</span>
<span class="text-[10px] text-gray-300 font-medium">URL</span>
</div>
<div class="absolute -left-4 bottom-1/3 bg-[#1E2E23] p-2 rounded-lg border border-primary/20 shadow-lg flex items-center gap-2 animate-bounce" style="animation-duration: 4s;">
<span class="material-symbols-outlined text-primary text-sm">text_fields</span>
<span class="text-[10px] text-gray-300 font-medium">Text</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col items-center text-center space-y-4 max-w-xs mx-auto z-10">
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight">
                Create Anything.
            </h1>
<p class="text-gray-400 text-base font-normal leading-relaxed">
                Instantly generate QR codes for websites, Wi-Fi networks, text, and more. Customize the look to match your style.
            </p>
</div>
</div>
<!-- Bottom Actions Area -->
<div class="w-full p-6 pb-10 flex flex-col items-center gap-6 bg-gradient-to-t from-background-dark to-transparent">
<!-- Pagination Indicators -->
<div class="flex flex-row items-center justify-center gap-2">
<div class="h-2 w-2 rounded-full bg-white/20"></div>
<div class="h-2 w-2 rounded-full bg-white/20"></div>
<div class="h-2 w-8 rounded-full bg-primary transition-all duration-300"></div>
</div>
<!-- Primary Button -->
<button class="w-full bg-primary hover:bg-[#0fd640] text-background-dark text-lg font-bold py-4 px-6 rounded-lg shadow-[0_0_20px_rgba(19,236,73,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            Get Started
            <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</body></html>
