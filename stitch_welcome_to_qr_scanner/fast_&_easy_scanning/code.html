<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fast &amp; Easy Scanning - Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec49",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102215",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased h-screen w-full flex flex-col overflow-hidden selection:bg-primary selection:text-background-dark">
<!-- Top Navigation -->
<div class="flex items-center justify-end px-6 pt-12 pb-2 shrink-0">
<button class="text-gray-500 dark:text-gray-400 text-sm font-semibold tracking-wide hover:text-primary transition-colors py-2 px-3 rounded-lg active:bg-black/5 dark:active:bg-white/10">
            Skip
        </button>
</div>
<!-- Main Visual Area (Hero) -->
<div class="flex-1 flex flex-col items-center justify-center w-full px-6 relative min-h-0">
<!-- Phone Mockup Container -->
<div class="relative w-full max-w-[280px] aspect-[9/16] max-h-[50vh] @container">
<!-- Glow effect behind the phone -->
<div class="absolute inset-0 bg-primary/20 blur-[60px] rounded-full transform scale-75 opacity-50"></div>
<!-- Phone Frame -->
<div class="absolute inset-0 bg-gray-100 dark:bg-[#1c1c1e] rounded-[2.5rem] border-[6px] border-gray-200 dark:border-[#2c2c2e] shadow-2xl overflow-hidden flex flex-col">
<!-- Screen Content (Camera View Simulation) -->
<div class="relative w-full h-full bg-gray-900 flex flex-col items-center justify-center overflow-hidden">
<!-- Abstract Camera Grid Overlay -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: linear-gradient(#ffffff 1px, transparent 1px), linear-gradient(90deg, #ffffff 1px, transparent 1px); background-size: 40px 40px; background-position: center center;">
</div>
<!-- Target / QR Code Visual -->
<div class="relative z-10 p-6 bg-white rounded-xl shadow-lg transform transition-transform">
<!-- Using a generic QR code pattern div instead of image for pure CSS control or image with alt -->
<div class="w-32 h-32 bg-contain bg-center bg-no-repeat" data-alt="A sample QR code displayed in the center of the scanning frame" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDADv8BCZc8K-rc5NTKgMuu9W1WHuI8yB2E7fYUbjYeCtafXMb6TLF4vmiC3HT03A5b0qzSbecDJGVswqfyG9hpGIPr3wTVND30-EMw_42PxH0jJ5VGYlKcbkEZkh1hacaNO6CbtfGRV0uwT8SJEYfDYMv7nwm8I64U4vZQKXOjcFo5fYdM8a6xj1sFOKkK0i6c1dzin4kVU4mX4IsbJWJWBabKBhQjuNTLGEoIWNnlR83SnIcdNcchqTLaANYHcpfy0mHXNJuHqAU7');"></div>
<!-- Corner Markers (Viewfinder) -->
<div class="absolute -top-3 -left-3 w-8 h-8 border-t-[4px] border-l-[4px] border-primary rounded-tl-xl"></div>
<div class="absolute -top-3 -right-3 w-8 h-8 border-t-[4px] border-r-[4px] border-primary rounded-tr-xl"></div>
<div class="absolute -bottom-3 -left-3 w-8 h-8 border-b-[4px] border-l-[4px] border-primary rounded-bl-xl"></div>
<div class="absolute -bottom-3 -right-3 w-8 h-8 border-b-[4px] border-r-[4px] border-primary rounded-br-xl"></div>
</div>
<!-- Laser Scan Line -->
<div class="absolute top-1/2 left-0 right-0 h-0.5 bg-primary shadow-[0_0_20px_4px_rgba(19,236,73,0.6)] z-20">
<!-- Gradient trail for motion blur effect -->
<div class="absolute bottom-0 left-0 w-full h-16 bg-gradient-to-t from-transparent to-primary/30"></div>
</div>
<!-- Floating 'Detected' Label -->
<div class="absolute bottom-8 px-4 py-2 bg-gray-800/90 backdrop-blur-md rounded-full border border-white/10 shadow-lg flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">qr_code_scanner</span>
<span class="text-white text-xs font-medium tracking-wide">Ready to scan</span>
</div>
</div>
</div>
</div>
</div>
<!-- Content & Controls -->
<div class="w-full flex flex-col bg-background-light dark:bg-background-dark pt-6 pb-10 px-6 z-10 shrink-0">
<!-- Text Section -->
<div class="mb-10 text-center mx-auto max-w-sm">
<h1 class="text-gray-900 dark:text-white text-[32px] font-bold leading-tight mb-3">
                Fast &amp; Easy Scanning
            </h1>
<p class="text-gray-600 dark:text-gray-300 text-base font-normal leading-relaxed">
                Point your camera at any QR code or barcode to get results instantly. No buttons to press.
            </p>
</div>
<!-- Footer Controls Row -->
<div class="flex flex-row items-center justify-between w-full">
<!-- Pagination Indicators -->
<div class="flex flex-row items-center gap-2.5">
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700"></div>
<!-- Active Indicator (Elongated) -->
<div class="h-2 w-8 rounded-full bg-primary shadow-[0_0_10px_rgba(19,236,73,0.4)]"></div>
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700"></div>
</div>
<!-- Primary Action Button -->
<button aria-label="Next Step" class="group relative flex items-center justify-center h-14 w-14 rounded-full bg-primary text-background-dark shadow-lg shadow-primary/20 hover:bg-[#0fd641] hover:scale-105 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[28px] font-bold">arrow_forward</span>
<!-- Inner Ring for detail -->
<div class="absolute inset-0 rounded-full border border-black/5"></div>
</button>
</div>
</div>
</body></html>
